<!-- Game Detail Modal Fragment -->
<div id="game-detail-modal" class="game-modal-overlay" aria-hidden="true">
    <div class="game-modal-card">
        <button id="close-game-modal" class="game-modal-close" aria-label="Cerrar">&times;</button>

        <div class="game-modal-body">
            <!-- Panel izquierdo: imagen de portada -->
            <div class="game-modal-image-panel">
                <img id="modal-game-image" src="" alt="" class="game-modal-cover">
            </div>

            <!-- Panel derecho: información -->
            <div class="game-modal-info-panel">
                <h2 id="modal-game-title" class="game-modal-title"></h2>

                <p class="game-modal-author">
                    <i class="fa fa-user-circle"></i>
                    <span id="modal-game-author" class="game-modal-author-name"></span>
                </p>

                <div class="game-modal-stats">
                    <span class="game-modal-stat game-modal-stat-views">
                        <i class="fa fa-eye"></i>
                        <span id="modal-game-views"></span> vistas
                    </span>
                    <span class="game-modal-stat game-modal-stat-downloads">
                        <i class="fa fa-download"></i>
                        <span id="modal-game-downloads"></span> descargas
                    </span>
                    <span class="game-modal-stat game-modal-stat-rating">
                        <i class="fa fa-star"></i>
                        <span id="modal-game-rating"></span>
                    </span>
                </div>

                <hr class="game-modal-divider">

                <div id="modal-game-processing" class="processing-banner" style="display: none;">
                    <span class="processing-spinner"></span>
                    <div>
                        <strong>⏳ Procesando tu juego…</strong>
                    </div>
                </div>

                <p id="modal-game-description" class="game-modal-description"></p>

                <div class="game-modal-actions">
                    <a id="modal-play-btn" href="#" class="game-modal-btn game-modal-btn-play" style="display: none;">
                        <i class="fa fa-play"></i> Jugar ahora
                    </a>
                    <a id="modal-download-btn" href="#" class="game-modal-btn game-modal-btn-download" style="display: none;">
                        <i class="fa fa-download"></i> Descargar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const initGameDetailModal = () => {
        const modal = document.getElementById('game-detail-modal');
        const closeBtn = document.getElementById('close-game-modal');
        if (!modal || !closeBtn) return;
        const actionsDisabled = !!document.querySelector('[data-game-actions-disabled="true"]');

        const openModal = (data) => {
            document.getElementById('modal-game-image').src = data.image;
            document.getElementById('modal-game-image').alt = data.title;
            document.getElementById('modal-game-title').textContent = data.title;
            document.getElementById('modal-game-author').textContent = data.author;
            document.getElementById('modal-game-views').textContent = data.views;
            document.getElementById('modal-game-downloads').textContent = data.downloads;
            document.getElementById('modal-game-rating').textContent = data.rating;
            document.getElementById('modal-game-description').textContent = data.description;

            const playBtn = document.getElementById('modal-play-btn');
            const downloadBtn = document.getElementById('modal-download-btn');
            const processingBanner = document.getElementById('modal-game-processing');

            if (data.isProcessing === 'true') {
                processingBanner.style.display = 'flex';
            } else {
                processingBanner.style.display = 'none';
            }

            playBtn.classList.remove('is-disabled');
            downloadBtn.classList.remove('is-disabled');
            playBtn.removeAttribute('aria-disabled');
            downloadBtn.removeAttribute('aria-disabled');
            playBtn.removeAttribute('tabindex');
            downloadBtn.removeAttribute('tabindex');

            if (actionsDisabled) {
                playBtn.style.display = 'inline-flex';
                downloadBtn.style.display = 'inline-flex';
                playBtn.removeAttribute('href');
                downloadBtn.removeAttribute('href');
                playBtn.classList.add('is-disabled');
                downloadBtn.classList.add('is-disabled');
                playBtn.setAttribute('aria-disabled', 'true');
                downloadBtn.setAttribute('aria-disabled', 'true');
                playBtn.setAttribute('tabindex', '-1');
                downloadBtn.setAttribute('tabindex', '-1');
            } else {
                if (data.urlPlay && data.urlPlay !== '') {
                    playBtn.href = data.urlPlay;
                    playBtn.style.display = 'inline-flex';
                } else {
                    playBtn.style.display = 'none';
                }

                if (data.urlDownload && data.urlDownload !== '') {
                    downloadBtn.href = data.urlDownload;
                    downloadBtn.style.display = 'inline-flex';
                } else {
                    downloadBtn.style.display = 'none';
                }
            }

            modal.setAttribute('aria-hidden', 'false');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        const openModalFromDataset = (dataset) => {
            openModal({
                id: dataset.gameId,
                title: dataset.gameTitle,
                description: dataset.gameDescription,
                image: dataset.gameImage,
                author: dataset.gameAuthor,
                views: dataset.gameViews,
                downloads: dataset.gameDownloads,
                rating: dataset.gameRating,
                urlPlay: dataset.gameUrlPlay,
                urlDownload: dataset.gameUrlDownload,
                isProcessing: dataset.gameIsProcessing
            });
        };

        window.closeGameModal = () => {
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        };

        closeBtn.addEventListener('click', window.closeGameModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) window.closeGameModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) window.closeGameModal();
        });

        const attachCardHandlers = () => {
            document.querySelectorAll('.game-item[data-game-id]').forEach((card) => {
                if (card.dataset.modalBound === 'true') return;
                card.dataset.modalBound = 'true';
                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    openModalFromDataset(card.dataset);
                });
            });
        };

        attachCardHandlers();

        // Event delegation for dynamic content (capture to avoid global interceptors)
        document.addEventListener('click', function(e) {
            const gameItem = e.target.closest('.game-item');
            if (gameItem && gameItem.hasAttribute('data-game-id')) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                openModalFromDataset(gameItem.dataset);
            }
        }, true);
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initGameDetailModal);
    } else {
        initGameDetailModal();
    }
</script>
