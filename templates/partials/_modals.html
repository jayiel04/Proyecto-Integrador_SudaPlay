    {% if not user.is_authenticated %}
    <div id="login-required-panel" class="login-required-panel" aria-hidden="true"
        data-login-base="{% url 'login:login' %}">
        <div class="login-required-card" role="dialog" aria-modal="true" aria-labelledby="login-required-title">
            <h3 id="login-required-title">Se requiere iniciar sesión</h3>
            <p>Para acceder a esta funcionalidad debes iniciar sesión.</p>
            <div class="login-required-actions">
                <button type="button" id="close-login-required-panel"
                    class="login-required-btn secondary">Cancelar</button>
                <a href="{% url 'login:login' %}" id="continue-login-required-panel"
                    class="login-required-btn primary">Iniciar sesión</a>
            </div>
        </div>
    </div>
    {% endif %}

    <div id="success-popup-panel" class="success-popup-panel" aria-hidden="true">
        <div class="success-popup-card" role="dialog" aria-modal="true" aria-labelledby="success-popup-title">
            <div class="success-popup-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3 id="success-popup-title">¡Éxito!</h3>
            <p id="success-popup-message"></p>
            <div class="success-popup-actions">
                <button type="button" id="close-success-popup" class="success-popup-btn primary">Aceptar</button>
            </div>
        </div>
    </div>
